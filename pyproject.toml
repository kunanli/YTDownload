[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytmusic"
version = "1.9.1"
description = "影音下載器：支援 YouTube、Bilibili、Vimeo、微信視頻號等 1700 多個網站，可下載音訊或影片、寫入標籤與封面、抓歌詞字幕，並記錄下載歷史"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "yt-dlp>=2024.1.1",
    "mutagen>=1.46",
]

[project.optional-dependencies]
cover = ["Pillow>=10.0"]
wechat = ["playwright>=1.40"]
dev = ["pytest>=7.0"]

[project.scripts]
ytmusic = "ytmusic.cli:main"

[tool.setuptools]
packages = ["ytmusic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
